name: Build plugin

# Every push builds the plugin. When the number in VERSION has no release yet,
# a push to main also publishes a GitHub release and updates manifest.json,
# which is what Jellyfin reads to install and update the plugin.
# To ship an update: change VERSION (e.g. 1.0.0.0 -> 1.0.1.0) and push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.BookReader/Jellyfin.Plugin.BookReader.csproj
          -c Release -o out
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        id: pkg
        run: |
          ZIP="bookreader_${{ steps.ver.outputs.version }}.zip"
          mkdir -p dist
          cp out/Jellyfin.Plugin.BookReader.dll dist/
          cp out/SharpCompress.dll dist/
          cp out/ZstdSharp.dll dist/ 2>/dev/null || true
          (cd dist && zip -r "../$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BookReader-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Book Reader ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true

      - name: Update Jellyfin manifest
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/${{ steps.pkg.outputs.zip }}
        run: |
          python3 .github/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Release ${{ steps.ver.outputs.tag }} [skip ci]" || exit 0
          git push origin HEAD:main
