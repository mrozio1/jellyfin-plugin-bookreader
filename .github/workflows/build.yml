name: Build plugin

# Every push builds the plugin and keeps the zip as a downloadable artifact.
# Pushing a tag like v1.0.0 also publishes a GitHub release and updates
# manifest.json, which is what Jellyfin reads to install and update the plugin.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="1.0.0"
          fi
          # Jellyfin uses four-part versions
          IFS='.' read -r a b c d <<< "$V"
          echo "version=${a:-1}.${b:-0}.${c:-0}.${d:-0}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.BookReader/Jellyfin.Plugin.BookReader.csproj
          -c Release -o out
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        id: pkg
        run: |
          ZIP="bookreader_${{ steps.ver.outputs.version }}.zip"
          mkdir -p dist
          cp out/Jellyfin.Plugin.BookReader.dll dist/
          cp out/SharpCompress.dll dist/
          cp out/ZstdSharp.dll dist/ 2>/dev/null || true
          (cd dist && zip -r "../$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BookReader-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true

      - name: Update Jellyfin manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pkg.outputs.zip }}
        run: |
          git fetch origin main
          git checkout main
          python3 .github/update_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Release ${{ github.ref_name }}" || exit 0
          git push origin main
